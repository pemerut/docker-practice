apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    group: example
spec:
  selector:
    app: second-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    group: example
spec:
  replicas: 1
  selector:
  #   matchLabels:
  #     app: second-app
  #     tier: backend
    matchExpressions:
      - {key: app, operator: In, values: [second-app, first-app]} #In this values
  template:
    metadata:
      labels:
        app: second-app
        tier: backend
    spec:
      containers:
        - name: second-node
          image: pemerut/app
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            initialDelaySeconds: 5